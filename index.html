<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <h2>Metric/Imperial Unit Conversion</h1>
        <p id="value-el" contenteditable="true">20</p>
        <button id="convert-btn">Convert</button>
        <div id="components">
            <p class="components-cls" id="length-el">Length(Meter/Feet)<br class="conversion-values-cls"> 20 meters = 65.616 feet | 20 feet = 6.096 meters</br></p>
            
            <p class="components-cls" id="volume-el">Volume(Liters/Gallons)<br class="conversion-values-cls"> 20 liters = 5.284 gallons | 20 gallons = 75.708 liters</br></p>
            
            <p class="components-cls" id="mass-el">Mass(Kilograms/Pounds)<br class="conversion-values-cls"> 20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</br></p>
        </div>
        
        <script src="index.js"></script>
    </body>
</html>
